[package]
name = "atoma-vllm-backend"
version.workspace = true
edition.workspace = true

[dependencies]
candle-core.workspace = true
candle-nn.workspace = true
candle-transformers.workspace = true
config.workspace = true
cudarc = { workspace = true, optional = true }
cuda-runtime-sys = { workspace = true, optional = true }
futures.workspace = true
flume.workspace = true
hf-hub.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
models.workspace = true
serde.workspace = true
serde_json.workspace = true
sys-info.workspace = true
tokenizers.workspace = true
tracing.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "fs"] }

[dev-dependencies]
rand.workspace = true
tracing-subscriber.workspace = true
tokenizers = { workspace = true, features = ["http"] }

[features]
cuda = [
  "candle-core/cuda",
  "candle-nn/cuda",
  "candle-transformers/cuda",
  "dep:cuda-runtime-sys",
  "models/cuda",
]
nccl = ["cuda", "dep:cudarc", "cudarc/nccl", "models/nccl"]
