[workspace]
members = [
    "crates/atoma-api",
    "crates/atoma-kernels",
    "crates/atoma-runtime",
    "crates/backends",
    "crates/backends/vllm",
    "crates/bench",
    "crates/graph-harness",
    "crates/models",
]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.89"
atoma-backends = { path = "crates/backends" }
atoma-bench = { path = "crates/bench" }
atoma-kernels = { path = "crates/atoma-kernels" }
atoma-runtime = { path = "crates/atoma-runtime" }
axum = "0.8"
bindgen_cuda = "0.1.5"
candle-core = "0.11.0"
candle-examples = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
chrono = "0.4.45"
clap = "4.5.18"
config = "0.15.25"
cuda-runtime-sys = "0.3.0-alpha.1"
cudarc = { version = "0.19.8", features = [
    "cublas",
    "cublaslt",
    "cuda-12000",
    "curand",
    "driver",
    "f16",
    "f8",
    "fallback-dynamic-loading",
    "nvrtc",
    "std",
], default-features = false }
flume = "0.12.0"
futures = "0.3.30"
half = "2.4.1"
hdrhistogram = "7.6.0"
hf-hub = "0.5.0"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
models = { path = "crates/models" }
proptest = "1.11.0"
rand = "0.9.0"
reqwest = "0.12.15" # hf-hub already pulls the 0.12 line; keep one copy
serde = "1.0.204"
serde_json = "1.0.120"
serial_test = "4.0.1"
sys-info = "0.9.1"
thiserror = "2"
tokenizers = "0.22.0"
tokio = "1.40.0"
tower = "0.5.3"
tracing = "0.1.40"
tracing-subscriber = "0.3.18"
utoipa = "5"
utoipa-swagger-ui = "9"
uuid = "1.24.0"
