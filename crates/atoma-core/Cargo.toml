[package]
description = "GPU-free engine core: protocol types, graph dispatch and the KV substrate"
edition     = { workspace = true }
license     = "Apache-2.0"
name        = "atoma-core"
version     = { workspace = true }

[dependencies]
serde     = { workspace = true, features = [ "derive" ] }
sha2      = { workspace = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

[dev-dependencies]
proptest           = { workspace = true }
serde_json         = { workspace = true }
tracing-subscriber = { workspace = true }

[lints.clippy]
await_holding_lock      = "deny"
dbg_macro               = "deny"
exit                    = "deny"
large_futures           = "deny"
mem_forget              = "deny"
module_name_repetitions = "allow"
panic_in_result_fn      = "deny"
pedantic                = { level = "warn", priority = -1 }
print_stderr            = "deny"
print_stdout            = "deny"
similar_names           = "allow"
todo                    = "warn"
unimplemented           = "deny"
