[inference]
api_key               = ""
cache_dir             = "./cache/"
device_ids            = [ 0 ]
dtype                 = "bf16"
flush_storage         = true
model_name            = "TinyLlama/TinyLlama-1.1B-Chat-v1.0"
num_tokenizer_workers = 4
revision              = "main"

# The engine tests serve `MockModel`, whose forward pass never reads the KV cache. The caches are
# sized explicitly rather than profiled so the tests do not claim a share of the host's RAM and GPU.
[cache]
block_size              = 16
cache_dtype             = "bf16"   # Most often, it agrees with inference.dtype
gpu_memory_utilization  = 0.5
num_gpu_blocks_override = 4096
swap_space_bytes        = 67108864

[scheduler]
block_size             = 16
delay_factor           = 0.8
enable_chunked_prefill = false
max_model_len          = 1024
max_num_batched_tokens = 1024
max_num_sequences      = 32

[validation]
best_of            = 1
max_input_length   = 4096
max_stop_sequences = 1
max_top_n_tokens   = 1
max_total_tokens   = 8192
