[package]
categories        = [ "science" ]
description       = "Large language models library, with fast and efficient memory management attention"
edition           = "2021"
license           = "MIT OR Apache-2.0"
name              = "models"
version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
candle-core.workspace         = true
candle-nn.workspace           = true
candle-transformers.workspace = true
csrc                          = { workspace = true }
cudarc                        = { workspace = true, optional = true }
half                          = { workspace = true, features = [ "num-traits" ] }
serde                         = { workspace = true, features = [ "derive" ] }
serde_json                    = { workspace = true }
tracing                       = { workspace = true }

[dev-dependencies]
candle-examples.workspace = true
hf-hub                    = { workspace = true }
rand                      = { workspace = true }
serde_json                = { workspace = true }
serial_test.workspace     = true
tokenizers                = { workspace = true }

[features]
cuda = [ "candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda", "csrc/cuda" ]
nccl = [ "cuda", "cudarc/nccl", "dep:cudarc" ]
