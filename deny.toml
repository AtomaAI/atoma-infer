[graph]
all-features = false
targets      = [ { triple = "x86_64-unknown-linux-gnu" } ]

[advisories]
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste is inherited through candle and tokenizers; no safe upgrade is available" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is inherited through reqwest; no safe upgrade is available" },
]

[licenses]
allow = [
    "Apache-2.0 WITH LLVM-exception",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[[licenses.clarify]]
crate         = "ring"
expression    = "ISC AND MIT AND OpenSSL"
license-files = [ { path = "LICENSE", hash = 0xbd0eed23 } ]

[licenses.private]
ignore = true

[bans]
allow                      = [  ]
allow-workspace            = true
deny                       = [  ]
external-default-features  = "allow"
highlight                  = "all"
multiple-versions          = "warn"
skip                       = [  ]
skip-tree                  = [  ]
wildcards                  = "allow"
workspace-default-features = "allow"

[sources]
allow-git        = [  ]
allow-registry   = [ "https://github.com/rust-lang/crates.io-index" ]
unknown-git      = "deny"
unknown-registry = "deny"
